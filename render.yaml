services:
  - type: web
    name: hermes-telegram
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USERS
        value: "5689404731"
      - key: API_SERVER_KEY
        generateValue: true
      - key: HERMES_MODEL_DEFAULT
        value: nvidia/nemotron-3-super-120b-a12b:free
